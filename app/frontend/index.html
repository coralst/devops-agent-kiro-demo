<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Demo Store</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <header>
    <h1>DevOps Demo Store</h1>
    <button id="reset-btn" type="button">Reset Fault</button>
  </header>

  <main>
    <div id="notification" class="notification hidden" role="alert"></div>
    <div id="product-grid" class="product-grid"></div>
    <div id="loading" class="loading">Loading products…</div>
    <div id="error-banner" class="error-banner hidden">
      <p>Failed to load products. Please try again.</p>
    </div>
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
